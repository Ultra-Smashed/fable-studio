<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fable Studio</title>
<style>
/* ===== FABLE STUDIO SHELL — nicht verändern ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#frame{position:relative;width:100%;height:100%;overflow:hidden;background:#000;container-type:size}
body.rec #frame{width:auto;height:min(100vh,calc(100vw * 16 / 9));aspect-ratio:9/16}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.fs-ui{transition:opacity .5s}
body.rec .fs-ui{opacity:0;pointer-events:none}
#hud{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.45))}
#hudTitle{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
#hudHint{font-size:12px;opacity:.6;margin-top:4px}
#btns{display:flex;gap:8px;pointer-events:auto}
#btns button{font:inherit;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#btns button:hover{background:rgba(255,255,255,.2)}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.8));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .9s}
#start.off{opacity:0;pointer-events:none}
#sTitle{margin:0 0 10px;font-size:clamp(26px,7cqw,54px);font-weight:800;letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
#sSub{margin:0 auto 26px;max-width:34em;font-size:clamp(14px,2.6cqw,17px);opacity:.75;line-height:1.45;text-wrap:balance}
#sBtn{font:inherit;font-size:16px;font-weight:700;color:#000;background:#fff;border:0;border-radius:999px;padding:14px 34px;cursor:pointer}
#sBtn:hover{transform:scale(1.04)}
#sNote{display:block;margin-top:12px;font-size:12px;opacity:.5}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:8px 16px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#err{position:absolute;left:12px;right:12px;top:12px;margin:0;display:none;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;
  background:#3a0a12;color:#ffd7dc;border:1px solid #ff5d73;border-radius:10px;padding:12px;z-index:9}
/* Film */
#cap{position:absolute;left:0;right:0;bottom:11%;padding:0 7%;text-align:center;font-size:clamp(17px,4.2cqw,30px);font-weight:600;line-height:1.3;
  text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;pointer-events:none;text-wrap:balance}
#cap.on{opacity:1}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;opacity:0;transition:opacity .8s;pointer-events:none}
#card.on{opacity:1}
#cardT{font-size:clamp(30px,9cqw,84px);font-weight:800;letter-spacing:-.02em;line-height:1.02;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.6)}
#cardS{margin-top:14px;font-size:clamp(14px,3cqw,22px);opacity:.75;letter-spacing:.04em;text-wrap:balance}
#prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;opacity:.7}
#again{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:none;font:inherit;font-size:15px;font-weight:700;color:#000;background:#fff;border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
/* Zeitreise */
#era{position:absolute;left:0;width:min(100%,max(44%,340px));top:0;padding:calc(20px + 3cqh) 6% 0;pointer-events:none;display:none}
#eraYear{white-space:nowrap;font-size:clamp(26px,6.2cqw,76px);font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 40px rgba(0,0,0,.7)}
#eraBadge{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:4px 10px;opacity:0;transition:opacity .5s}
#eraBadge.on{opacity:.9}
#eraTitle{margin-top:12px;font-size:clamp(18px,4.4cqw,34px);font-weight:700;line-height:1.15;text-wrap:balance;transition:opacity .5s;text-shadow:0 2px 20px rgba(0,0,0,.8)}
#eraText{margin-top:8px;max-width:min(30em,100%);font-size:clamp(13px,2.7cqw,18px);line-height:1.45;opacity:.8;text-wrap:pretty;transition:opacity .5s;text-shadow:0 2px 14px rgba(0,0,0,.9)}
#axis{position:absolute;left:6%;right:6%;bottom:64px;height:44px;display:none;cursor:pointer;touch-action:none}
#axisLine{position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(255,255,255,.25)}
#axisFill{position:absolute;left:0;top:10px;height:2px;width:0;background:#fff}
#axisKnob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff}
.axDot{position:absolute;top:7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#000;border:2px solid rgba(255,255,255,.6)}
.axLab{position:absolute;top:22px;transform:translateX(-50%);font-size:10px;opacity:.55;white-space:nowrap;font-variant-numeric:tabular-nums}
@container (max-width:520px){.axLab{display:none}}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="gl"></canvas>
  <div id="card"><div id="cardT"></div><div id="cardS"></div></div>
  <div id="cap"></div>
  <div id="era" class="fs-keep"><div id="eraYear"></div><div id="eraBadge">Prognose</div><div id="eraTitle"></div><div id="eraText"></div></div>
  <div id="axis" class="fs-ui"><div id="axisLine"></div><div id="axisFill"></div><div id="axisKnob"></div></div>
  <div id="prog" class="fs-ui"></div>
  <button id="again" class="fs-ui">Nochmal ansehen</button>
  <div id="hud" class="fs-ui"><div><div id="hudTitle"></div><div id="hudHint"></div></div>
    <div id="btns"><button id="bSound">Ton an</button><button id="bRec" title="Hochformat für Bildschirmaufnahmen">9:16</button></div></div>
  <div id="start"><div><h1 id="sTitle"></h1><p id="sSub"></p><button id="sBtn">Starten</button><small id="sNote">mit Ton</small></div></div>
  <div id="toast"></div>
  <pre id="err"></pre>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   FABLE STUDIO ENGINE v1  —  diesen Block nicht verändern.
   Stellt bereit: FS.scene, FS.camera, FS.rig, FS.audio, FS.post, FS.film,
   FS.reise und Helfer. Die Szene steht im zweiten <script>-Block weiter unten.
   ========================================================================== */
const FS = (function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), canvas = $('gl');
  const FS = { started: false, time: 0, rec: false, width: 1, height: 1, portrait: false };

  /* ---------- Fehler sichtbar machen ---------- */
  function showErr(msg) {
    const e = $('err');
    e.textContent = 'Fehler: ' + msg + '\nKopiere diese Meldung in den Chat, dann wird sie behoben.';
    e.style.display = 'block';
  }
  window.addEventListener('error', (e) => showErr(e.message + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', (e) => showErr(String(e.reason)));
  if (!window.THREE) { showErr('three.js konnte nicht geladen werden.'); throw new Error('THREE fehlt'); }

  /* ---------- Mathe ---------- */
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const ease = { linear: (t) => t, inOut: smooth, out: (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3), in: (t) => Math.pow(clamp(t, 0, 1), 3) };
  function makeRng(seed) {
    let s = (seed >>> 0) || 1;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(r.range(a, b + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    return r;
  }
  Object.assign(FS, { clamp, lerp, smooth, ease, rng: makeRng, rand: makeRng(7) });

  /* ---------- Renderer ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
  const gl = renderer.getContext();
  const gl2 = renderer.capabilities.isWebGL2;
  const hdr = gl2
    ? !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))
    : !!(gl.getExtension('OES_texture_half_float') && gl.getExtension('OES_texture_half_float_linear') && gl.getExtension('EXT_color_buffer_half_float'));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
  camera.position.set(0, 2, 10);
  scene.add(camera);
  Object.assign(FS, { renderer, scene, camera, hdr });

  const rtType = hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
  function makeRT(w, h, depth) {
    const rt = new THREE.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
      type: rtType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: !!depth, stencilBuffer: false
    });
    rt.texture.generateMipmaps = false;
    return rt;
  }

  /* ---------- Nachbearbeitung: Bloom, Vignette, Korn, Tonemapping ---------- */
  const post = FS.post = { bloom: 1, threshold: hdr ? 1.0 : 0.72, vignette: 0.35, grain: 0.035, aberration: 0.004, exposure: 1, saturation: 1, fade: 1 };
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quadScene = new THREE.Scene();
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial());
  quad.frustumCulled = false; quadScene.add(quad);
  const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const mkPass = (frag, uniforms) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
  function runPass(mat, target) { mat.uniformsNeedUpdate = true; quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }
  const F_BRIGHT = 'uniform sampler2D tex;uniform vec2 px;uniform float threshold;varying vec2 vUv;void main(){' +
    'vec3 c=texture2D(tex,vUv+px*vec2(-.5,-.5)).rgb+texture2D(tex,vUv+px*vec2(.5,-.5)).rgb+texture2D(tex,vUv+px*vec2(-.5,.5)).rgb+texture2D(tex,vUv+px*vec2(.5,.5)).rgb;c*=.25;' +
    'c=max(c,vec3(0.));float l=max(c.r,max(c.g,c.b));float k=max(l-threshold,0.)/max(l,1e-4);gl_FragColor=vec4(min(c*k,vec3(6.)),1.);}';
  const F_DOWN = 'uniform sampler2D tex;uniform vec2 px;varying vec2 vUv;void main(){vec3 c=texture2D(tex,vUv).rgb*4.;' +
    'c+=texture2D(tex,vUv+px*vec2(-1.,-1.)).rgb+texture2D(tex,vUv+px*vec2(1.,-1.)).rgb+texture2D(tex,vUv+px*vec2(-1.,1.)).rgb+texture2D(tex,vUv+px*vec2(1.,1.)).rgb;gl_FragColor=vec4(c/8.,1.);}';
  const F_UP = 'uniform sampler2D tex;uniform sampler2D base;uniform vec2 px;varying vec2 vUv;void main(){vec3 c=texture2D(tex,vUv+px*vec2(-2.,0.)).rgb+texture2D(tex,vUv+px*vec2(2.,0.)).rgb+texture2D(tex,vUv+px*vec2(0.,2.)).rgb+texture2D(tex,vUv+px*vec2(0.,-2.)).rgb;' +
    'c+=2.*(texture2D(tex,vUv+px*vec2(-1.,-1.)).rgb+texture2D(tex,vUv+px*vec2(1.,-1.)).rgb+texture2D(tex,vUv+px*vec2(-1.,1.)).rgb+texture2D(tex,vUv+px*vec2(1.,1.)).rgb);' +
    'gl_FragColor=vec4(texture2D(base,vUv).rgb+c/12.,1.);}';
  const F_COMP = 'uniform sampler2D tScene;uniform sampler2D tBloom;uniform float bloom,vignette,grain,aberration,exposure,saturation,fade,time;varying vec2 vUv;' +
    'vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}' +
    'float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}' +
    'void main(){vec2 d=vUv-.5;vec2 o=d*aberration*dot(d,d)*4.;vec3 c;c.r=texture2D(tScene,vUv+o).r;c.g=texture2D(tScene,vUv).g;c.b=texture2D(tScene,vUv-o).b;' +
    'c=max(c,vec3(0.))+texture2D(tBloom,vUv).rgb*bloom*.22;c*=exposure;c*=1.-vignette*smoothstep(.3,1.,length(d)*1.3);c=aces(c);' +
    'float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,saturation);c=pow(c,vec3(1./2.2));' +
    'c+=(hash(vUv*vec2(1733.,977.)+fract(time)*91.)-.5)*grain;gl_FragColor=vec4(c*fade,1.);}';
  const LEVELS = 5;
  const mBright = mkPass(F_BRIGHT, { tex: { value: null }, px: { value: new THREE.Vector2() }, threshold: { value: 1 } });
  const mDown = [], mUp = [];
  for (let i = 0; i < LEVELS; i++) {
    mDown.push(mkPass(F_DOWN, { tex: { value: null }, px: { value: new THREE.Vector2() } }));
    mUp.push(mkPass(F_UP, { tex: { value: null }, base: { value: null }, px: { value: new THREE.Vector2() } }));
  }
  const mComp = mkPass(F_COMP, { tScene: { value: null }, tBloom: { value: null }, bloom: { value: 1 }, vignette: { value: 0 }, grain: { value: 0 },
    aberration: { value: 0 }, exposure: { value: 1 }, saturation: { value: 1 }, fade: { value: 1 }, time: { value: 0 } });

  let W = 2, H = 2, pr = Math.min(window.devicePixelRatio || 1, 2), rtScene = null, rtDown = [], rtUp = [];
  let baseFov = 60;
  const resizeCbs = [];
  function resize() {
    const r = frame.getBoundingClientRect();
    W = Math.max(2, Math.round(r.width)); H = Math.max(2, Math.round(r.height));
    renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
    FS.width = W; FS.height = H; FS.portrait = H > W * 1.1;
    camera.aspect = W / H; camera.fov = FS.portrait ? Math.min(baseFov * 1.3, 95) : baseFov; camera.updateProjectionMatrix();
    const w = Math.round(W * pr), h = Math.round(H * pr);
    [rtScene].concat(rtDown, rtUp).forEach((t) => t && t.dispose());
    rtScene = makeRT(w, h, true); rtDown = []; rtUp = [];
    let cw = w, ch = h;
    for (let i = 0; i < LEVELS; i++) { cw = Math.max(2, cw >> 1); ch = Math.max(2, ch >> 1); rtDown.push(makeRT(cw, ch)); rtUp.push(makeRT(cw, ch)); }
    resizeCbs.forEach((f) => f(W, H));
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame); else window.addEventListener('resize', resize);

  function render() {
    renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
    mBright.uniforms.tex.value = rtScene.texture; mBright.uniforms.px.value.set(1 / rtScene.width, 1 / rtScene.height); mBright.uniforms.threshold.value = post.threshold;
    runPass(mBright, rtDown[0]);
    for (let i = 1; i < LEVELS; i++) {
      mDown[i].uniforms.tex.value = rtDown[i - 1].texture; mDown[i].uniforms.px.value.set(1 / rtDown[i - 1].width, 1 / rtDown[i - 1].height);
      runPass(mDown[i], rtDown[i]);
    }
    let src = rtDown[LEVELS - 1];
    for (let i = LEVELS - 2; i >= 0; i--) {
      mUp[i].uniforms.tex.value = src.texture; mUp[i].uniforms.base.value = rtDown[i].texture; mUp[i].uniforms.px.value.set(1 / src.width, 1 / src.height);
      runPass(mUp[i], rtUp[i]); src = rtUp[i];
    }
    const u = mComp.uniforms;
    u.tScene.value = rtScene.texture; u.tBloom.value = src.texture; u.bloom.value = post.bloom; u.vignette.value = post.vignette; u.grain.value = post.grain;
    u.aberration.value = post.aberration; u.exposure.value = post.exposure; u.saturation.value = post.saturation; u.fade.value = post.fade; u.time.value = FS.time;
    runPass(mComp, null);
  }

  /* ---------- Rückrufe ---------- */
  const updaters = [], startCbs = [], tapCbs = [], keyCbs = [];
  FS.onUpdate = (f) => { updaters.push(f); return f; };
  FS.onStart = (f) => { startCbs.push(f); };
  FS.onTap = (f) => { tapCbs.push(f); };
  FS.onKey = (f) => { keyCbs.push(f); };
  FS.onResize = (f) => { resizeCbs.push(f); };
  FS.add = (o) => { scene.add(o); return o; };

  /* ---------- Kamera-Rig ---------- */
  const rig = FS.rig = { mode: 'none', yaw: 0, pitch: 0, tyaw: 0, tpitch: 0, speed: 1, tspeed: 1, dist: 0, baseSpeed: 6, sway: 0.004, idle: 99,
    maxYaw: 1.25, maxPitch: 0.6, fn: null, target: new THREE.Vector3(), radius: 10, r: 10, zoom: 1, oyaw: 0, opitch: 0.25, auto: 0.08, paused: false };
  const v3 = (p) => (p && p.isVector3) ? p : new THREE.Vector3(p[0], p[1], p[2]);
  FS.v3 = v3;
  /* Fahrt: fn(strecke, zeit) liefert [position, blickpunkt] */
  rig.cruise = (fn, o = {}) => { rig.mode = 'cruise'; rig.fn = fn; rig.baseSpeed = o.speed != null ? o.speed : 6; rig.sway = o.sway != null ? o.sway : 0.004; };
  /* Fahrt entlang einer Punkteliste (geschlossene Schleife, außer closed:false) */
  rig.path = (pts, o = {}) => {
    const closed = o.closed !== false, curve = new THREE.CatmullRomCurve3(pts.map(v3), closed), len = curve.getLength(), ahead = o.lookAhead != null ? o.lookAhead : 8;
    const wrap = (u) => closed ? ((u % 1) + 1) % 1 : clamp(u, 0, 1);
    rig.curve = curve;
    rig.cruise((d) => [curve.getPointAt(wrap(d / len)), curve.getPointAt(wrap((d + ahead) / len))], o);
  };
  /* Kreisen um ein Ziel */
  rig.orbit = (target, radius, o = {}) => {
    rig.mode = 'orbit'; rig.target.copy(v3(target)); rig.radius = rig.r = radius; rig.zoom = 1;
    rig.opitch = o.pitch != null ? o.pitch : 0.25; rig.oyaw = o.yaw || 0; rig.auto = o.autoRotate != null ? o.autoRotate : 0.08;
  };
  rig.manual = () => { rig.mode = 'manual'; };
  function updateRig(dt, t) {
    rig.idle += dt;
    const k = (r) => 1 - Math.exp(-dt * r);
    if (rig.mode === 'cruise' && rig.fn) {
      if (FS.rec) { rig.tyaw = 0; rig.tpitch = 0; rig.tspeed = 1; }
      else if (rig.idle > 3.5) { rig.tyaw *= Math.exp(-dt * 0.9); rig.tpitch *= Math.exp(-dt * 0.9); }
      rig.yaw = lerp(rig.yaw, rig.tyaw, k(6)); rig.pitch = lerp(rig.pitch, rig.tpitch, k(6));
      rig.speed = lerp(rig.speed, rig.paused ? 0 : rig.tspeed, k(3));
      rig.dist += rig.baseSpeed * rig.speed * dt;
      const r = rig.fn(rig.dist, t);
      camera.position.copy(r[0]); camera.lookAt(r[1]);
      camera.rotateY(rig.yaw + Math.sin(t * 0.31) * rig.sway * 2);
      camera.rotateX(rig.pitch + Math.sin(t * 0.43 + 1) * rig.sway);
    } else if (rig.mode === 'orbit') {
      if (rig.idle > 2.5 || FS.rec) rig.oyaw += rig.auto * dt;
      rig.r = lerp(rig.r, rig.radius * rig.zoom, k(5));
      const cp = Math.cos(rig.opitch);
      camera.position.set(rig.target.x + Math.sin(rig.oyaw) * cp * rig.r, rig.target.y + Math.sin(rig.opitch) * rig.r, rig.target.z + Math.cos(rig.oyaw) * cp * rig.r);
      camera.lookAt(rig.target);
    }
  }

  /* ---------- Eingabe ---------- */
  const pts = new Map(); let moved = 0, multi = false, pinch = 0, lastTap = 0;
  function zoomBy(d) {
    rig.idle = 0;
    if (rig.mode === 'cruise') rig.tspeed = clamp(rig.tspeed + d * 1.5, -1, 4);
    else if (rig.mode === 'orbit') rig.zoom = clamp(rig.zoom * (1 - d), 0.35, 2.5);
  }
  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { moved = 0; multi = false; } else { multi = true; pinch = 0; }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
    if (FS.rec) return;
    if (pts.size === 1) {
      moved += Math.abs(dx) + Math.abs(dy); rig.idle = 0;

ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -L / 2); ground.renderOrder = -5; FS.add(ground);
const marks = [];
for (let z = L; z > -2 * L; z -= 8) marks.push([0, z, 0.22, 3.4]);
[-60, -140, 20, 100, -220, -300].forEach((z) => { for (let x = -5.2; x <= 5.2; x += 1.3) marks.push([x, z, 0.62, 4]); });
const markMesh = FS.inst(plane, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.55, depthWrite: false }), marks.length, (i, d, c) => { const m = marks[i]; d.position.set(m[0], 0.02, m[1]); d.rotation.x = -Math.PI / 2; d.scale.set(m[2], m[3], 1); c.copy(FS.col('#cfd6ff', 0.55)); });
markMesh.renderOrder = -4; FS.add(markMesh);
const curb = FS.inst(box, new THREE.MeshBasicMaterial(), 2, (i, d, c) => { d.position.set(i ? 6.2 : -6.2, 0.07, -L / 2); d.scale.set(0.3, 0.14, 3 * L); c.copy(FS.col('#121120')); });
FS.add(curb);

/* ---------- Bewegte Dinge (laufen relativ zur Kamera und wickeln sich um) ---------- */
const dyn = new THREE.Group(), dynMirror = new THREE.Group(); dynMirror.scale.y = -1; FS.add(dyn); FS.add(dynMirror);
const SPAN = 300, wrapRel = (v) => ((v + SPAN / 2) % SPAN + SPAN) % SPAN - SPAN / 2;
const share = (mesh) => { const m = new THREE.InstancedMesh(mesh.geometry, mesh.material, mesh.count); m.instanceMatrix = mesh.instanceMatrix; m.instanceColor = mesh.instanceColor; m.frustumCulled = false; dynMirror.add(m); dyn.add(mesh); return mesh; };
const dummy = new THREE.Object3D();

// Autos: dunkler Körper, Scheinwerfer vorn, Rücklichter hinten
const cars = []; for (let i = 0; i < 12; i++) { const dir = i % 2 ? 1 : -1; cars.push({ dir, x: dir > 0 ? R.pick([3.1, 5.0]) : -R.pick([3.1, 5.0]), p: R.range(0, SPAN), v: R.range(9, 17) }); }
const carBody = share(FS.inst(box, new THREE.MeshLambertMaterial(), cars.length, (i, d, c) => c.copy(FS.col(R.pick(['#1a1a26', '#2a1530', '#0f2030'])))));
const carLights = share(FS.inst(box, new THREE.MeshBasicMaterial(), cars.length * 2, (i, d, c) => c.copy((i & 1) ? FS.col('#ff1a2e', 4) : FS.col('#eaf4ff', 6))));
const carGlow = FS.glows(cars.flatMap(() => [{ pos: [0, 0, 0], color: '#dfeeff', size: 9, k: 0.7 }, { pos: [0, 0, 0], color: '#ff2030', size: 6, k: 0.6 }]));
dyn.add(carGlow); const cgm = new THREE.Points(carGlow.geometry, carGlow.material); cgm.frustumCulled = false; dynMirror.add(cgm);

// Fluggleiter über der Straße
const fly = []; for (let i = 0; i < 9; i++) fly.push({ dir: i % 2 ? 1 : -1, x: R.range(-8, 8), y: R.range(20, 46), p: R.range(0, SPAN), v: R.range(22, 40) });
const flyBody = share(FS.inst(box, new THREE.MeshLambertMaterial(), fly.length, (i, d, c) => c.copy(FS.col('#11111a'))));
const flyGlow = FS.glows(fly.flatMap((f, i) => [{ pos: [0, 0, 0], color: '#ffffff', size: 7, k: 1 }, { pos: [0, 0, 0], color: NEON[i % NEON.length], size: 9, k: 0.9 }]));
dyn.add(flyGlow);

// Passanten mit leuchtenden Schirmen
const ppl = []; for (let i = 0; i < 46; i++) { const s = i % 2 ? 1 : -1; ppl.push({ x: s * R.range(6.8, 9.3), p: R.range(0, SPAN), v: R.range(0.7, 1.5) * R.pick([-1, 1]), ph: R.range(0, 6) }); }
const pplBody = share(FS.inst(box, new THREE.MeshLambertMaterial(), ppl.length, (i, d, c) => c.copy(FS.col('#0b0b12'))));
const pplUmb = share(FS.inst(new THREE.ConeGeometry(0.72, 0.3, 10), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85 }), ppl.length, (i, d, c) => c.copy(FS.col(R.pick(NEON.concat(['#e8e8ff', '#e8e8ff'])), R.range(0.5, 1.5)))));

// Regen
const RAIN = 1700, rainPos = new Float32Array(RAIN * 6), drops = [];
for (let i = 0; i < RAIN; i++) drops.push({ x: R.range(-26, 26), y: R.range(0, 30), z: R.range(-46, 22), v: R.range(22, 34) });
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: FS.col('#9fb4ff', 0.9), transparent: true, opacity: 0.32, depthWrite: false })); rain.frustumCulled = false; FS.add(rain);

// Dampf aus Schächten
const steam = []; for (let i = 0; i < 26; i++) steam.push({ x: R.pick([-6.6, 6.6, -3, 3]) + R.range(-0.5, 0.5), p: R.range(0, SPAN), y: R.range(0, 7), col: R.pick(NEON) });
const steamGlow = FS.glows(steam.map((s) => ({ pos: [0, 0, 0], color: s.col, size: 14, k: 0.07 }))); dyn.add(steamGlow);

/* ---------- Kamera ---------- */
FS.rig.cruise((d) => {
  const z = -(d % L), x = Math.sin(d * 0.021) * 1.1, lift = FS.smooth((Math.sin(d * 0.0131 - 1.2) - 0.55) / 0.45), y = 2.3 + Math.sin(d * 0.017) * 0.4 + lift * 7.5;
  return [new THREE.Vector3(x, y, z), new THREE.Vector3(Math.sin((d + 26) * 0.021) * 0.8, y * 0.72 + 1.7, z - 26)];
}, { speed: 7.5 });

/* ---------- Animation ---------- */
let flash = 0;
FS.onUpdate((dt, t) => {
  const cz = FS.camera.position.z, base = FS.rig.dist;      // base = zurückgelegte Strecke ohne Umbruch
  holoMat.uniforms.time.value = t;
  // Autos
  const cg = carGlow.geometry.attributes.position;
  cars.forEach((c, i) => {
    c.p += c.dir * c.v * dt; const z = cz + wrapRel(c.p - (-base));
    dummy.rotation.set(0, 0, 0); dummy.position.set(c.x, 0.62, z); dummy.scale.set(1.75, 0.95, 4.2); dummy.updateMatrix(); carBody.setMatrixAt(i, dummy.matrix);
    const fz = z + c.dir * 2.12, bz = z - c.dir * 2.12;
    dummy.position.set(c.x, 0.62, fz); dummy.scale.set(1.5, 0.16, 0.08); dummy.updateMatrix(); carLights.setMatrixAt(i * 2, dummy.matrix);
    dummy.position.set(c.x, 0.7, bz); dummy.updateMatrix(); carLights.setMatrixAt(i * 2 + 1, dummy.matrix);
    cg.setXYZ(i * 2, c.x, 0.7, fz + c.dir * 0.4); cg.setXYZ(i * 2 + 1, c.x, 0.75, bz - c.dir * 0.3);
  });
  carBody.instanceMatrix.needsUpdate = true; carLights.instanceMatrix.needsUpdate = true; cg.needsUpdate = true;
  // Fluggleiter
  const fg = flyGlow.geometry.attributes.position;
  fly.forEach((f, i) => {
    f.p += f.dir * f.v * dt; const z = cz + wrapRel(f.p - (-base)), y = f.y + Math.sin(t * 0.6 + i) * 1.2;
    dummy.rotation.set(0, 0, 0); dummy.position.set(f.x, y, z); dummy.scale.set(1.6, 0.45, 3.6); dummy.updateMatrix(); flyBody.setMatrixAt(i, dummy.matrix);
    fg.setXYZ(i * 2, f.x, y, z + f.dir * 1.9); fg.setXYZ(i * 2 + 1, f.x, y - 0.3, z - f.dir * 1.9);
  });
  flyBody.instanceMatrix.needsUpdate = true; fg.needsUpdate = true;
  // Passanten
  ppl.forEach((p, i) => {
    p.p += p.v * dt; const z = cz + wrapRel(p.p - (-base)), bob = Math.abs(Math.sin(t * 5 * Math.abs(p.v) + p.ph)) * 0.05;
    dummy.rotation.set(0, 0, 0); dummy.position.set(p.x, 0.98 + bob, z); dummy.scale.set(0.46, 1.6, 0.3); dummy.updateMatrix(); pplBody.setMatrixAt(i, dummy.matrix);
    dummy.position.set(p.x, 2.02 + bob, z); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); pplUmb.setMatrixAt(i, dummy.matrix);
  });
  pplBody.instanceMatrix.needsUpdate = true; pplUmb.instanceMatrix.needsUpdate = true;
  // Regen: fällt in einem Kasten, der der Kamera folgt
  const cx = FS.camera.position.x;
  for (let i = 0; i < RAIN; i++) {
    const d = drops[i]; d.y -= d.v * dt; if (d.y < 0) { d.y += 30; d.x = R.range(-26, 26); d.z = R.range(-46, 22); }
    const o = i * 6; rainPos[o] = cx + d.x; rainPos[o + 1] = d.y; rainPos[o + 2] = cz + d.z; rainPos[o + 3] = cx + d.x + 0.12; rainPos[o + 4] = d.y + 1.05; rainPos[o + 5] = cz + d.z;
  }
  rainGeo.attributes.position.needsUpdate = true;
  // Dampf
  const sg = steamGlow.geometry.attributes.position;
  steam.forEach((s, i) => { s.y += dt * 1.1; if (s.y > 8) s.y = 0; sg.setXYZ(i, s.x + Math.sin(t * 0.5 + i) * 0.8, 0.5 + s.y, cz + wrapRel(s.p - (-base))); });
  sg.needsUpdate = true;
  // Blitz klingt ab
  flash = Math.max(0, flash - dt * 2.2);
  const fl = flash * flash * (0.6 + 0.4 * Math.sin(t * 60));
  hemi.intensity = 1.1 + fl * 9; FS.post.exposure = 1.05 + fl * 0.5;
});

/* ---------- Interaktion: Tippen löst Blitz und Donner aus ---------- */
function lightning() {
  flash = 1;
  FS.audio.whoosh({ color: 'brown', type: 'lowpass', from: 900, to: 70, dur: 3.2, attack: 0.03, gain: 0.9, reverb: 0.6 });
  FS.audio.whoosh({ color: 'white', type: 'bandpass', from: 5000, to: 900, dur: 0.5, attack: 0.01, gain: 0.25, reverb: 0.4 });
}
FS.onTap(lightning);

/* ---------- Ton: Regen, Stadt, langsamer Synth ---------- */
FS.onStart(() => {
  const A = FS.audio; if (!A.ctx) return;
  A.noise({ color: 'pink', type: 'bandpass', freq: 2600, q: 0.35, gain: 0.17 });                 // Regen
  A.noise({ color: 'white', type: 'highpass', freq: 6500, gain: 0.02 });                        // Zischen
  A.noise({ color: 'brown', type: 'lowpass', freq: 170, gain: 0.3 });                           // Stadtgrollen
  const chords = [[50, 57, 60, 65], [46, 53, 58, 62], [41, 48, 57, 60], [48, 55, 59, 64]];      // Dm7, B, F, C
  const pad = A.pad(chords[0], { gain: 0.05, cutoff: 750, reverb: 0.7 });
  const scale = [62, 65, 67, 69, 72, 74, 77];
  A.loop({ bpm: 84, div: 4, fn(i, time, sd) {
    const bar = Math.floor(i / 16) % 4, s = i % 16, root = chords[bar][0] - 12;
    if (s === 0) pad.to(chords[bar], 1.5);
    if (s === 0 || s === 10) A.kick(time, 0.42);
    if (s === 4 || s === 12) A.snare(time, 0.1);
    if (s % 2 === 0) A.hat(time, s % 4 === 2 ? 0.07 : 0.03);
    if ([0, 3, 6, 10, 13].includes(s)) A.tone(root, { time, dur: sd * 1.6, wave: 'sawtooth', gain: 0.2, cutoff: 420, sweep: 160, release: 0.12 });
    if ((i * 7 + bar * 3) % 5 < 2) A.tone(scale[(i * 5 + bar * 2) % scale.length] + (s > 8 ? 12 : 0), { time, dur: sd * 0.8, wave: 'triangle', gain: 0.055, cutoff: 3200, reverb: 0.8, release: 0.5 });
  } });
});

})();
</script>
